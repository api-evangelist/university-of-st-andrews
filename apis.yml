x-coverage:
  state: none
  reason: no_public_api
  detail: >-
    St Andrews authors no public API and operates no developer portal, and after a full probe
    sweep on 2026-09-01 that is the correct measurement rather than a gap in the search. The
    four conventional developer hostnames - api., data., opendata. and developer.st-andrews.ac.uk
    - are all NXDOMAIN. The institution's genuinely own machine-readable surfaces are protocol
    endpoints rather than products: a working DSpace OAI-PMH 2.0 interface with twelve metadata
    formats, a UK Access Management Federation Shibboleth IdP that serves its own SAML metadata,
    and registrant records in DataCite, Crossref and ROR. Three negative findings are recorded
    rather than smoothed over. First, https://www.st-andrews.ac.uk/llms.txt returns 200 with
    content-type text/plain but its body is byte-identical to sitemap.xml - it is an XML sitemap
    misfiled under an llms.txt name, so no llms.txt credit is taken. Second,
    https://timetables.st-andrews.ac.uk/ returns 200 on every path including /robots.txt with
    the same 24,707-byte Angular shell (title "Publish", a Scientia web-timetabling product):
    a soft-200 SPA, not a machine surface, and its bundle exposes no institution API endpoint.
    Third, the Pure OAI-PMH endpoint recorded in this repository since June 2026 is gone -
    risweb.st-andrews.ac.uk/ws/oai 301s to the portal home page and research-portal
    /ws/oai 301s to /error/. Two live vendor tenancies remain recorded as relationships:
    Elsevier Pure for the research portal and SorryApp for the status page. The status API's
    three OpenAPI documents and their derived artifacts were removed on 2026-09-01 because the
    contract is SorryApp's product template, not St Andrews' engineering; the repository
    therefore holds no contract, which is the honest state.
