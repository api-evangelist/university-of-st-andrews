- aid: university-of-st-andrews:status-api
  name: University of St Andrews Service Status API (SorryApp tenancy)
  description: >-
    The University publishes IT service status at status.st-andrews.ac.uk, which carries a
    read-only JSON API at /api/v1 with /status, /components and /notices. Verified live on
    2026-09-01: /api/v1/status returned 200 naming page 13609 "University of St Andrews service
    status" with 110 components and 288 notices. The data is entirely St Andrews' - named
    campus systems, real maintenance windows - but the contract is not. The host CNAMEs to
    a5b404ba.sorryapp.com on Heroku, and the documentation page at /api is SorryApp's product
    template, carrying placeholder example values (counts of 50 and 100, timestamps of
    2023-01-01) that do not match the live deployment. This is the same class as an Atlassian
    Statuspage tenancy, and it is recorded the same way: tenant, relationship kept, vendor
    contract not saved. Three OpenAPI documents describing this API, and the twenty-three
    schema, example, collection, rule, vocabulary, JSON-LD and agentic-access artifacts derived
    from them, were removed from this repository on 2026-09-01 for exactly this reason.
