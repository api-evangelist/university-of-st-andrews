- aid: university-of-st-andrews:repository-oai
  name: St Andrews Research Repository OAI-PMH
  description: >-
    OAI-PMH 2.0 endpoint for the DSpace-based St Andrews Research Repository, the University's
    open-access repository of theses, articles and other research outputs. Verified live on
    2026-09-01: verb=Identify returns repositoryName "St Andrews Research Repository",
    protocolVersion 2.0, adminEmail Digital-Repository@st-andrews.ac.uk, earliestDatestamp
    2006-11-21 and granularity to the second. verb=ListMetadataFormats returns twelve prefixes
    (oai_dc, qdc, mods, mets, ore, rdf, marc, dim, didl, xoai, etdms, uketd_dc) and
    verb=ListSets returns the community and collection hierarchy under handle prefix 10023.
    The host is under the University's own registrable domain and the repository content,
    handles and administration are the University's; the application is hosted for St Andrews
    by University of Edinburgh Information Services (the host CNAMEs to
    research-repository.st-andrews-lb.is.ed.ac.uk), a sector shared service rather than a
    commercial platform, so this is recorded as institution-operated. No spec is saved: OAI-PMH
    is a protocol with a published standard, not a per-institution contract.
