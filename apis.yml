aid: university-of-st-andrews
name: University of St Andrews
x-type: university
x-category: Public Research University
description: >-
  The University of St Andrews is Scotland's first university, chartered in 1413 with teaching
  from 1410, and a public research institution in Fife with ROR identifier
  https://ror.org/02wn5qz54. It authors no public API and operates no developer portal: probes on
  2026-09-01 found no host at api.st-andrews.ac.uk, data.st-andrews.ac.uk,
  opendata.st-andrews.ac.uk or developer.st-andrews.ac.uk, all four NXDOMAIN. What St Andrews
  genuinely operates itself, on its own registrable domain, is metadata and identity
  infrastructure rather than product APIs. Three surfaces are the institution's own. Its DSpace
  research repository serves a fully working OAI-PMH 2.0 interface at
  research-repository.st-andrews.ac.uk/oai/request with twelve metadata formats including the UK
  electronic-theses profile uketd_dc. Its Shibboleth Identity Provider, entityID
  https://idp.st-andrews.ac.uk/shibboleth, has been registered in the UK Access Management
  Federation since January 2008, carries REFEDS Sirtfi assurance, and serves its own live SAML
  metadata at login.st-andrews.ac.uk/idp/shibboleth. And it is an enrolled registrant in the
  scholarly identifier registries, as DataCite provider NAHY and Crossref member 6332. Everything
  else that looks like a St Andrews API is a vendor's contract running under a St Andrews name:
  the research portal at research-portal.st-andrews.ac.uk is an Elsevier Pure tenancy, and the
  service status page at status.st-andrews.ac.uk is a SorryApp tenancy. Both are recorded here as
  tenant relationships, which they are, and neither vendor's contract is saved under this slug.
