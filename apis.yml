- aid: university-of-st-andrews:identity-federation
  name: University of St Andrews Shibboleth Identity Provider
  description: >-
    The University's own SAML 2.0 / Shibboleth Identity Provider, entityID
    https://idp.st-andrews.ac.uk/shibboleth, registered in the UK Access Management Federation
    as entity uk000278 since 2008-01-16 and therefore reachable through eduGAIN. The IdP serves
    its own machine-readable SAML metadata at https://login.st-andrews.ac.uk/idp/shibboleth
    (verified 200, application/xml, 4,351 bytes, validUntil 2040-07-01). The federation entity
    declares shibmd:Scope st-andrews.ac.uk, SSO bindings over HTTP-POST, HTTP-POST-SimpleSign
    and HTTP-Redirect, an AttributeAuthorityDescriptor exposing SAML 1.0 and 2.0 SOAP attribute
    queries, and REFEDS Sirtfi assurance certification. A federation is shared by definition and
    the IdP behind it is the institution's own - this is the strongest institution-operated
    machine-readable surface St Andrews has.
