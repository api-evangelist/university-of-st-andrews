  - date: '2026-09-01'
    rating: 2
    summary: >-
      Re-reviewed under the university pipeline's operator axis, which changes the
      conclusion of the June 2026 review without changing the underlying facts much.
      St Andrews authors no public API and runs no developer portal - api., data.,
      opendata. and developer.st-andrews.ac.uk are all NXDOMAIN. What it does operate
      itself is protocol infrastructure: a fully working DSpace OAI-PMH 2.0 interface
      (twelve metadata formats, including the UK theses profile uketd_dc) and a UK
      Access Management Federation Shibboleth IdP registered since 2008 that serves its
      own live SAML metadata. It is a registrant in DataCite (NAHY), Crossref (6332)
      and ROR (02wn5qz54). Three corrections to the June review. The Pure OAI-PMH
      endpoint at risweb.st-andrews.ac.uk/ws/oai is dead - it 301s to the portal home
      page, and the portal's own /ws/oai 301s to /error/. The status API is live and
      reachable (the June 406 was a client-header artifact, not a block) but it is a
      SorryApp tenancy - status.st-andrews.ac.uk CNAMEs to a5b404ba.sorryapp.com and
      the /api docs page is SorryApp's product template with placeholder counts - so
      its three OpenAPI documents and their derived artifacts were removed as vendor
      engineering. The research repository is not throttled: every OAI verb returned
      200. Also noted, www.st-andrews.ac.uk/llms.txt is a misfiled copy of sitemap.xml.
    endpoints:
      - url: https://research-repository.st-andrews.ac.uk/oai/request?verb=Identify
        status: 200
        note: OAI-PMH 2.0 Identify; institution-operated, not throttled as the June review recorded.
      - url: https://research-repository.st-andrews.ac.uk/oai/request?verb=ListMetadataFormats
