    summary: >-
      St Andrews has no centralized developer portal. The confirmed public,
      machine-readable surface is research-data and operational interoperability:
      a documented JSON service-status API (Sorry platform, 10 req/sec), a Pure
      OAI-PMH endpoint behind the Research Portal (verified live, HTTP 200), and a
      DSpace OAI-PMH endpoint for the Research Repository (confirmed via search;
      host returned 503/throttling to automated probes at review time). The
      official StAResComp Research Computing GitHub org exists (HTTP 200). No
      fabricated endpoints; status API base path returns 406 to non-browser User
      Agents but is documented and live. LinkedIn returns 999 to bots (login
      gate) but the school page exists.
